<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<title>Колесо фортуны — выиграй стикеры!</title>
<style>
  :root { --neon: #c07bff; --neon-soft: rgba(160,90,255,.35); }
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Segoe UI', 'Roboto', Arial, sans-serif;
    background-color: #1a0b2e;
    min-height: 100vh;
    color: #fff;
    overflow-x: hidden;
  }
  body::before {
    content: '';
    position: fixed; inset: 0; z-index: -2;
    background: url('bg-violet.png') center / cover no-repeat;
  }
  body::after {
    content: '';
    position: fixed; inset: 0; z-index: -1;
    background: url('blood.png') center / cover no-repeat, url('grime.png') center / cover no-repeat, repeating-linear-gradient(0deg, rgba(0,0,0,.12) 0px, rgba(0,0,0,.12) 1px, transparent 1px, transparent 4px), radial-gradient(ellipse at top, rgba(43,16,85,.28) 0%, rgba(26,11,46,.58) 140%);
  }

  .container {
    max-width: 1100px;
    margin: 0 auto;
    padding: 30px 20px 60px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 22px;
  }

  h1 {
    font-size: clamp(26px, 4vw, 42px);
    text-align: center;
    background: linear-gradient(90deg, #ffd700, #ff9a3d, #ffd700);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    text-shadow: 0 0 40px rgba(255, 215, 0, .25);
    letter-spacing: 1px;
  }

  .subtitle { color: #c9b8ff; margin-top: -12px; text-align: center; }

  .nav { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  .nav-link {
    color: #c9b8ff;
    text-decoration: none;
    font-size: 14px;
    border: 1px solid rgba(201,184,255,.35);
    padding: 7px 16px;
    border-radius: 20px;
    transition: background .2s;
  }
  .nav-link:hover { background: rgba(201,184,255,.12); }

  .wheel-stage {
    position: relative;
    width: min(92vw, 460px);
    height: min(92vw, 460px);
    filter: drop-shadow(0 20px 50px rgba(0,0,0,.55));
  }

  canvas#wheel { width: 100%; height: 100%; }

  .pointer {
    position: absolute;
    top: -14px;
    left: 50%;
    transform: translateX(-50%);
    width: 0; height: 0;
    border-left: 22px solid transparent;
    border-right: 22px solid transparent;
    border-top: 38px solid #e62e2e;
    filter: drop-shadow(0 0 10px rgba(230,46,46,.85));
    z-index: 5;
  }

  .hub {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 90px; height: 90px;
    border-radius: 50%;
    background: radial-gradient(circle at 50% 40%, #1b0f30 0%, #0b0910 70%);
    border: 3px solid #c07bff;
    display: flex; align-items: center; justify-content: center;
    font-size: 34px;
    z-index: 4;
    box-shadow: 0 0 18px rgba(192,123,255,.75), 0 0 42px rgba(192,123,255,.35), inset 0 0 22px rgba(192,123,255,.28);
    cursor: pointer;
    user-select: none;
    transition: transform .15s, box-shadow .15s;
  }
  .hub::before {
    content: '';
    position: absolute;
    inset: 6px;
    border-radius: 50%;
    border: 1px dashed rgba(192,123,255,.65);
    animation: wheelRing 18s linear infinite reverse;
  }
  .hub::after {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: repeating-linear-gradient(0deg, rgba(0,0,0,.4) 0 1px, transparent 1px 3px);
    pointer-events: none;
  }
  .hub:hover {
    transform: translate(-50%,-50%) scale(1.07);
    box-shadow: 0 0 26px rgba(192,123,255,.95), 0 0 60px rgba(192,123,255,.45), inset 0 0 30px rgba(192,123,255,.4);
  }

  .spin-btn {
    padding: 16px 56px;
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 2px;
    color: #3a2500;
    background: linear-gradient(180deg, #ffe259, #ffa751);
    border: none;
    border-radius: 50px;
    cursor: pointer;
    box-shadow: 0 8px 25px rgba(255, 167, 81, .45), inset 0 2px 0 rgba(255,255,255,.6);
    transition: transform .15s, box-shadow .15s;
  }
  .spin-btn:hover:not(:disabled) { transform: translateY(-2px) scale(1.03); }
  .spin-btn:disabled { opacity: .55; cursor: not-allowed; }

  .stats { color: #c9b8ff; font-size: 15px; text-align: center; }
  .stats b { color: #ffd700; }

  .progress-wrap { width: min(92vw, 460px); margin-top: 8px; }
  .progress-bar {
    height: 10px;
    background: rgba(255,255,255,.12);
    border-radius: 6px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #ffd700, #ff9a3d);
    border-radius: 6px;
    transition: width .6s;
  }
  .progress-label { font-size: 12px; color: #9d8fd0; margin-top: 4px; text-align: center; }

  /* ---------- редкости ---------- */
  .tier-common    { --tier: #b8c0cc; --tier-bg: rgba(184,192,204,.10); }
  .tier-uncommon  { --tier: #2ecc71; --tier-bg: rgba(46,204,113,.14); }
  .tier-rare      { --tier: #3498ff; --tier-bg: rgba(52,152,255,.16); }
  .tier-epic      { --tier: #b26bff; --tier-bg: rgba(178,107,255,.18); }
  .tier-legendary { --tier: #ffd700; --tier-bg: rgba(255,215,0,.20); }

  .legend {
    display: flex; gap: 14px; flex-wrap: wrap; justify-content: center;
    font-size: 12px; color: #c9b8ff;
  }
  .legend span { display: inline-flex; align-items: center; gap: 5px; }
  .legend i { width: 12px; height: 12px; border-radius: 4px; display: inline-block; background: var(--tier); }

  /* ---------- коллекция ---------- */
  .collection {
    width: 100%;
    background: rgba(255,255,255,.06);
    border: 1px solid rgba(255,255,255,.12);
    border-radius: 20px;
    padding: 22px 26px;
    backdrop-filter: blur(6px);
  }
  .collection h2 { font-size: 20px; margin-bottom: 14px; color: #ffe9a8; }
  .collection .empty { color: #9d8fd0; font-style: italic; }

  .stickers-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(92px, 1fr));
    gap: 12px;
  }

  .sticker-card {
    position: relative;
    background: var(--tier-bg);
    border: 2px solid var(--tier);
    border-radius: 14px;
    padding: 10px 6px 8px;
    text-align: center;
    animation: popIn .45s cubic-bezier(.34,1.56,.64,1);
    box-shadow: 0 0 10px color-mix(in srgb, var(--tier) 25%, transparent);
  }
  .sticker-card img { width: 100%; aspect-ratio: 1; object-fit: contain; }
  .sticker-card .emoji-big { font-size: 44px; line-height: 1.25; display: block; }
  .sticker-card .name {
    font-size: 10px; margin-top: 4px; color: #e8e2ff;
    overflow: hidden; display: -webkit-box;
    -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  }
  .sticker-card .count {
    position: absolute; top: -8px; right: -8px;
    background: #ff4757; color: #fff;
    min-width: 24px; height: 24px; line-height: 24px;
    border-radius: 12px; font-size: 12px; font-weight: 700;
    padding: 0 5px;
    box-shadow: 0 3px 8px rgba(0,0,0,.4);
  }
  .tier-badge {
    position: absolute; top: -8px; left: -8px;
    background: var(--tier);
    color: #1a0b2e; font-size: 9px; font-weight: 800;
    padding: 3px 7px; border-radius: 9px;
    letter-spacing: .5px;
  }

  @keyframes popIn {
    0% { transform: scale(0); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }

  /* ---------- модалка ---------- */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(10, 4, 30, .8);
    display: flex; align-items: center; justify-content: center;
    z-index: 100;
    opacity: 0; pointer-events: none;
    transition: opacity .3s;
    backdrop-filter: blur(4px);
  }
  .modal-overlay.show { opacity: 1; pointer-events: auto; }

  .modal {
    background: linear-gradient(160deg, #3b1d6e, #1e0f3d);
    border: 2px solid rgba(255,215,0,.5);
    border-radius: 24px;
    padding: 34px 40px;
    text-align: center;
    max-width: 90vw;
    transform: scale(.7);
    transition: transform .35s cubic-bezier(.34,1.56,.64,1);
    box-shadow: 0 0 60px rgba(255,215,0,.25);
  }
  .modal-overlay.show .modal { transform: scale(1); }

  .modal h2 { font-size: 28px; color: #ffd700; margin-bottom: 6px; }
  .modal .prize-label { color: #c9b8ff; margin-bottom: 20px; }

  .won-stickers { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; }
  .won-item { animation: popIn .5s cubic-bezier(.34,1.56,.64,1) backwards; }
  .won-item:nth-child(2) { animation-delay: .15s; }
  .won-item:nth-child(3) { animation-delay: .3s; }
  .won-item .won-emoji {
    font-size: 88px; line-height: 1.3;
    width: 130px; height: 130px;
    display: flex; align-items: center; justify-content: center;
    background: var(--tier-bg);
    border: 2px solid var(--tier);
    border-radius: 20px;
    box-shadow: 0 0 20px color-mix(in srgb, var(--tier) 35%, transparent);
  }
  .won-item img.won-img {
    width: 130px; height: 130px; object-fit: contain;
    background: var(--tier-bg);
    border: 2px solid var(--tier);
    border-radius: 20px;
    box-shadow: 0 0 24px color-mix(in srgb, var(--tier) 45%, transparent);
  }
  .won-item .won-name { font-size: 12px; color: #ffe9a8; margin-top: 6px; max-width: 130px; }
  .won-item .won-tier { font-size: 10px; font-weight: 800; color: var(--tier); text-transform: uppercase; letter-spacing: .5px; }

  .close-btn {
    margin-top: 24px;
    padding: 12px 40px;
    font-size: 16px; font-weight: 700;
    color: #3a2500;
    background: linear-gradient(180deg, #ffe259, #ffa751);
    border: none; border-radius: 30px;
    cursor: pointer;
    transition: transform .15s;
  }
  .close-btn:hover { transform: scale(1.05); }

  #confetti-canvas { position: fixed; inset: 0; pointer-events: none; z-index: 99; }
</style>
<link rel="stylesheet" href="cyberpunk.css?v=20">

<body>

<canvas id="confetti-canvas"></canvas>

<div class="container">
  <h1>🎡 КОЛЕСО ФОРТУНЫ</h1>
  <p class="subtitle">Крути колесо и собери все 1006 стикеров!</p>

  <div class="nav">
    <a class="nav-link" href="lottery.html">🎱 Лотерея 6 из 49</a>
    <a class="nav-link" href="slots.html">🎰 Слот-машина</a>
  </div>

  <div class="legend">
    <span class="tier-common"><i></i>Обычный</span>
    <span class="tier-uncommon"><i></i>Необычный</span>
    <span class="tier-rare"><i></i>Редкий</span>
    <span class="tier-epic"><i></i>Эпический</span>
    <span class="tier-legendary"><i></i>Легендарный</span>
  </div>

  <div class="wheel-stage">
    <div class="pointer"></div>
    <canvas id="wheel" width="920" height="920"></canvas>
    <div class="hub" id="hub">🎁</div>
  </div>

  <button class="spin-btn" id="spinBtn">КРУТИТЬ!</button>

  <div class="stats">
    Вращений: <b id="spinCount">0</b> &nbsp;•&nbsp; Стикеров выиграно: <b id="stickerCount">0</b>
    <div class="progress-wrap">
      <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
      <div class="progress-label" id="progressLabel"></div>
    </div>
  </div>

  <div class="collection">
    <h2>🏆 Коллекция колеса фортуны</h2>
    <p class="empty" id="emptyMsg">Пока пусто — играй и выигрывай!</p>
    <div class="stickers-grid" id="collection"></div>
  </div>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h2 id="modalTitle">Победа!</h2>
    <p class="prize-label" id="modalPrize"></p>
    <div class="won-stickers" id="wonStickers"></div>
    <button class="close-btn" id="closeModal">Забрать приз</button>
  </div>
</div>

<script src="stickers-data.js?v=20"></script>
<script src="shared.js?v=20"></script>
<script>
/* ================== СОХРАНЕНИЕ ЭТОЙ ИГРЫ ================== */
initGame('wheel');
STATE.stats.wheelSpins = STATE.stats.wheelSpins || 0;
STATE.stats.wheelWon = STATE.stats.wheelWon || 0;

/* ================== СЕКТОРЫ ================== */
const SECTORS = [
  { label: 'СТИКЕР',     type: 'sticker', count: 1, color: '#1b0f30', glow: '#c07bff' },
  { label: 'ПУСТО',      type: 'empty',   count: 0, color: '#0b0910', glow: '#4a4458' },
  { label: '×2 СТИКЕРА', type: 'sticker', count: 2, color: '#22120a', glow: '#ff9a3d' },
  { label: 'СТИКЕР',     type: 'sticker', count: 1, color: '#0a1a2e', glow: '#35c4ff' },
  { label: 'РЕДКИЙ+',    type: 'rare',    count: 1, color: '#241a05', glow: '#ffd900' },
  { label: 'СТИКЕР',     type: 'sticker', count: 1, color: '#081d12', glow: '#3dffa8' },
  { label: 'ПУСТО',      type: 'empty',   count: 0, color: '#0b0910', glow: '#4a4458' },
  { label: 'ДЖЕКПОТ ×3', type: 'jackpot', count: 3, color: '#2b060d', glow: '#ff4d6a' },
];

const NORMAL_W  = [58.5, 26, 11, 4, 0.5];  // обычный сектор
const RARE_W    = [0, 0, 55, 30, 15];      // «РЕДКИЙ+»
const JACKPOT_W = [0, 35, 40, 18, 7];      // джекпот

/* ================== СОСТОЯНИЕ СТРАНИЦЫ ================== */
let spinning = false;
let angle = 0;

/* ================== КОЛЕСО ================== */
const canvas = document.getElementById('wheel');
const ctx = canvas.getContext('2d');
const SIZE = canvas.width;
const R = SIZE / 2;

function drawWheel(rotation) {
  ctx.clearRect(0, 0, SIZE, SIZE);
  const n = SECTORS.length;
  const arc = (Math.PI * 2) / n;

  ctx.save();
  ctx.translate(R, R);
  ctx.rotate(rotation);

  for (let i = 0; i < n; i++) {
    const start = i * arc - Math.PI / 2 - arc / 2;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.arc(0, 0, R - 12, start, start + arc);
    ctx.closePath();
    ctx.fillStyle = SECTORS[i].color;
    ctx.fill();
    ctx.strokeStyle = 'rgba(192,123,255,.5)';
    ctx.lineWidth = 2;
    ctx.stroke();

    ctx.save();
    ctx.rotate(start + arc / 2);
    ctx.textAlign = 'right';
    ctx.fillStyle = SECTORS[i].glow;
    ctx.font = 'bold 28px Consolas, "Courier New", monospace';
    ctx.shadowColor = SECTORS[i].glow;
    ctx.shadowBlur = 14;
    ctx.fillText(SECTORS[i].label, R - 46, 10);
    ctx.restore();
  }

  // неоновый обод
  ctx.beginPath();
  ctx.arc(0, 0, R - 6, 0, Math.PI * 2);
  ctx.lineWidth = 5;
  ctx.strokeStyle = '#c07bff';
  ctx.shadowColor = '#c07bff';
  ctx.shadowBlur = 18;
  ctx.stroke();
  ctx.shadowBlur = 0;

  const bulbs = 16;
  for (let i = 0; i < bulbs; i++) {
    const a = (i / bulbs) * Math.PI * 2;
    ctx.beginPath();
    ctx.arc(Math.cos(a) * (R - 6), Math.sin(a) * (R - 6), 4, 0, Math.PI * 2);
    ctx.fillStyle = (i % 2 === 0) ? '#c07bff' : '#eaf6ff';
    ctx.shadowColor = ctx.fillStyle;
    ctx.shadowBlur = 8;
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  ctx.restore();
}
drawWheel(angle);

/* ================== ВРАЩЕНИЕ ================== */
function spin() {
  if (spinning) return;
  spinning = true;
  document.getElementById('spinBtn').disabled = true;

  const n = SECTORS.length;
  const arc = (Math.PI * 2) / n;
  const targetIndex = Math.floor(Math.random() * n);

  const currentMod = ((angle % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2);
  const targetMod = ((-targetIndex * arc) % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2);
  let delta = targetMod - currentMod;
  if (delta < 0) delta += Math.PI * 2;

  const fullTurns = (5 + Math.floor(Math.random() * 3)) * Math.PI * 2;
  const jitter = (Math.random() - 0.5) * arc * 0.6;
  const totalDelta = fullTurns + delta - jitter;

  const duration = 5200 + Math.random() * 800;
  const startAngle = angle;
  const startTime = performance.now();
  let lastTickSector = -1;

  function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }

  function frame(now) {
    const t = Math.min((now - startTime) / duration, 1);
    angle = startAngle + totalDelta * easeOutCubic(t);
    drawWheel(angle);

    const mod = ((angle % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2);
    const sectorAtPointer = Math.round(((Math.PI * 2) - mod) / arc) % n;
    if (sectorAtPointer !== lastTickSector) {
      lastTickSector = sectorAtPointer;
      if (t < 0.95) tickSound();
    }

    if (t < 1) requestAnimationFrame(frame);
    else finishSpin(targetIndex);
  }
  requestAnimationFrame(frame);
}

/* ================== РЕЗУЛЬТАТ ================== */
function finishSpin(index) {
  const sector = SECTORS[index];
  STATE.stats.wheelSpins++;
  saveState();
  document.getElementById('spinCount').textContent = STATE.stats.wheelSpins;

  if (sector.type === 'empty') {
    Sound.loss();
    showModal('😕 Пусто!', pickRand(PHRASES.wheelEmpty), []);
  } else {
    const w = sector.type === 'rare' ? RARE_W : sector.type === 'jackpot' ? JACKPOT_W : NORMAL_W;
    const won = [];
    for (let i = 0; i < sector.count; i++) {
      const s = pickSticker(w);
      won.push(s);
      awardSticker(s);
      STATE.stats.wheelWon++;
    }
    saveState();
    document.getElementById('stickerCount').textContent = STATE.stats.wheelWon;

    const bestTier = won.reduce((a, s) => Math.max(a, TIER_RANK[s.tier]), 0);
    const titles = {
      sticker: pickRand(PHRASES.wheelWin),
      rare: pickRand(PHRASES.wheelRare),
      jackpot: pickRand(PHRASES.wheelJackpot)
    };
    const labels = {
      sticker: sector.count > 1 ? `Ты выиграл ${sector.count} стикера!` : 'Ты выиграл стикер!',
      rare: 'Гарантированно редкий стикер или лучше!',
      jackpot: 'Сразу 3 стикера с повышенной редкостью!'
    };
    if (sector.type === 'sticker' && bestTier >= 3) titles.sticker = pickRand(PHRASES.wheelRare);
    showModal(titles[sector.type], labels[sector.type], won);
    winJingle();
    Confetti.launch(sector.type !== 'sticker' ? 220 : 120);
  }

  renderCollection(document.getElementById('collection'), document.getElementById('emptyMsg'));
  updateProgress(document.getElementById('progressFill'), document.getElementById('progressLabel'));
  spinning = false;
  document.getElementById('spinBtn').disabled = false;
}

/* ================== МОДАЛКА ================== */
const overlay = document.getElementById('modalOverlay');
function showModal(title, label, stickers) {
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalPrize').textContent = label;
  const box = document.getElementById('wonStickers');
  box.innerHTML = '';
  stickers.forEach(s => box.appendChild(buildWonItem(s)));
  overlay.classList.add('show');
}
bindModal(overlay, document.getElementById('closeModal'));

/* ================== ИНИЦИАЛИЗАЦИЯ ================== */
Confetti.init(document.getElementById('confetti-canvas'));
Sound.init();
document.getElementById('spinBtn').addEventListener('click', spin);
document.getElementById('hub').addEventListener('click', spin);

document.getElementById('spinCount').textContent = STATE.stats.wheelSpins;
document.getElementById('stickerCount').textContent = STATE.stats.wheelWon;
renderCollection(document.getElementById('collection'), document.getElementById('emptyMsg'));
updateProgress(document.getElementById('progressFill'), document.getElementById('progressLabel'));
</script>
</body>
</html>
